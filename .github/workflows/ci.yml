name: ci

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: d2k

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - name: "[preparation] resolve image tag"
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "[preparation] set up golang"
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: "[execution] build"
        run: go build ./...

      - name: "[validation] route table matches the pinned API spec"
        run: |
          go generate ./internal/apispec
          git diff --exit-code internal/apispec/routes_gen.go

      - name: "[execution] vet"
        run: go vet ./...

      - name: "[execution] test"
        run: go test -race ./...

      - name: "[execution] lint"
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

      - name: "[execution] check for known vulnerabilities"
        # Fails on any vulnerability d2k's code reaches, except these
        # github.com/docker/docker advisories: they affect the Docker daemon
        # (AuthZ plugins, plugin privileges), which d2k does not run, and the
        # module has no fixed version. They go away with the move to
        # github.com/moby/moby/api.
        env:
          ALLOWED: GO-2026-4883|GO-2026-4887
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -format json ./... > govulncheck.json
          found=$(jq -r 'select(.finding.trace[0].function) | .finding.osv' govulncheck.json | sort -u | grep -vxE "$ALLOWED" || true)
          if [ -n "$found" ]; then
            echo "::error::Reachable vulnerabilities: $found"
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [tag, test]
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "[preparation] set up golang"
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: "[preparation] verify go mod tidy"
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum > /dev/null 2>&1; then
            echo "::warning::go.mod or go.sum is out of date — please run 'go mod tidy' locally and commit the changes"
          fi

      - name: "[preparation] set up qemu"
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: "[preparation] set up docker buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: "[execution] build multi-arch image and export as oci tarball"
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: false
          load: false
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ needs.tag.outputs.value }}
          outputs: type=oci,dest=/tmp/image.tar

      - name: "[execution] save image tag metadata"
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ needs.tag.outputs.value }}" > /tmp/image-tag.txt

      - name: "[execution] upload image artifact"
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-image
          path: /tmp/image.tar
          retention-days: 1

      - name: "[execution] upload image tag artifact"
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-image-tag
          path: /tmp/image-tag.txt
          retention-days: 1

      - name: "[preparation] log in to registry"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: "[execution] build and push multi-arch image"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: portainerci/${{ env.IMAGE_NAME }}:${{ needs.tag.outputs.value }}
          sbom: true
          provenance: mode=max
