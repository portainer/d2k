name: ci

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  REGISTRY: portainerci
  IMAGE_NAME: d2k

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - name: "[preparation] resolve image tag"
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "[preparation] tidy modules"
        uses: actions/setup-go@4b73464b60e97efce5cc67aceb4b199e0e1b0692 # v6.3.0
        with:
          go-version-file: go.mod

      - name: "[preparation] verify go mod tidy"
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum > /dev/null 2>&1; then
            echo "::warning::go.mod or go.sum is out of date — please run 'go mod tidy' locally and commit the changes"
          fi

      - name: "[preparation] set up QEMU"
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: "[preparation] set up Docker Buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: "[preparation] log in to registry"
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "[execution] build and push multi-arch image"
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.tag.outputs.value }} \
            .
