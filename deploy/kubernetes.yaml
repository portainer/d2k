# Namespace that d2k is deployed into. Change this to your target namespace.
# If the namespace doesn't exist, d2k will create it on startup.
# Note: d2k does not need to be in the same namespace as your workloads,
# but it's simplest to manage if it is.
apiVersion: v1
kind: Namespace
metadata:
  name: d2k   # change to your target namespace
  # No pod-security.kubernetes.io labels: the Pod Security level of the
  # workloads d2k creates here is set by the cluster default or by Portainer's
  # Pod Security Standards policy, which manages these labels. Setting them
  # here would override that policy on every apply.
---
# ServiceAccount that d2k runs as. Bound to the namespace Role below for
# workload management, and to the ClusterRole below for read-only node access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: d2k
  namespace: d2k   # change to your target namespace
  labels:
    app: d2k

---
# Role grants d2k the minimum permissions it needs to manage workloads
# within the target namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: d2k
  namespace: d2k   # change to your target namespace
rules:
  # Deployments — core workload primitive
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Pods — containers with restart policy "no" or "on-failure" run as pods;
  # all pods are read for state, logs and exec
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["create"]

  # Services — created alongside Deployments for port mappings
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]

  # ConfigMaps — used for swarm identity (d2k-identity) and swarm configs
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Secrets — used for swarm secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PersistentVolumeClaims — docker volume create/rm
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "watch", "list", "create", "delete"]

  # Namespaces — this Role applies to d2k's own namespace object only. get:
  # cluster UID derivation and connectivity check. patch: the Docker networks
  # are recorded as d2k.portainer.io/network-* annotations on it; the
  # ValidatingAdmissionPolicy below lets d2k change nothing else there.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "patch"]

  # ResourceQuotas — read-only, used to inject requests.cpu/memory when the
  # namespace quota enforces them (Docker has no concept of ResourceQuotas)
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]

  # Metrics — optional, used for docker stats
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Events — read-only, used for docker events history
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]

---
# RoleBinding ties the namespace-scoped Role to the ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: d2k
  namespace: d2k   # change to your target namespace
subjects:
  - kind: ServiceAccount
    name: d2k
    namespace: d2k   # change to your target namespace
roleRef:
  kind: Role
  name: d2k
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole grants read-only access to nodes across the cluster.
# Nodes are a cluster-scoped resource and cannot be granted via a namespaced Role.
# Required for: SwarmListNodes, SwarmInspectNode, and leader election in /info
# (matching the API server host to a control-plane node IP).
# Node state changes (drain/pause/active) and label mutations are intentionally
# blocked — d2k is a workload consumption tool, not a cluster administration tool.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d2k-node-reader
  labels:
    app: d2k
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding ties the node ClusterRole to the d2k ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d2k-node-reader
  labels:
    app: d2k
subjects:
  - kind: ServiceAccount
    name: d2k
    namespace: d2k   # change to your target namespace
roleRef:
  kind: ClusterRole
  name: d2k-node-reader
  apiGroup: rbac.authorization.k8s.io

---
# RBAC cannot limit which fields d2k patches on its namespace: this policy
# lets d2k's ServiceAccount change only its d2k.portainer.io/network-*
# annotations there, so it can never change the namespace's labels (such as
# pod-security.kubernetes.io/*, managed by Portainer's policies), other
# annotations or spec. It applies to the ServiceAccount "d2k" of the
# namespace being changed, so one policy covers every d2k installation.
# Requires Kubernetes 1.30 or later.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: d2k-namespace-network-annotations
  labels:
    app: d2k
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: d2k-of-this-namespace
      expression: request.userInfo.username == "system:serviceaccount:" + object.metadata.name + ":d2k"
  variables:
    - name: prefix
      expression: "'d2k.portainer.io/network-'"
    - name: before
      expression: "oldObject.metadata.?annotations.orValue({})"
    - name: after
      expression: "object.metadata.?annotations.orValue({})"
  validations:
    - expression: >-
        variables.before.all(k, k.startsWith(variables.prefix) || (k in variables.after && variables.after[k] == variables.before[k])) &&
        variables.after.all(k, k.startsWith(variables.prefix) || k in variables.before)
      message: d2k may change only the d2k.portainer.io/network-* annotations of its namespace
    - expression: >-
        object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
        object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
        object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
        object.?spec == oldObject.?spec
      message: d2k may not change its namespace's labels, finalizers, owners or spec
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: d2k-namespace-network-annotations
  labels:
    app: d2k
spec:
  policyName: d2k-namespace-network-annotations
  validationActions: [Deny]

---
# Deployment running d2k itself inside the target namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: d2k
  namespace: d2k   # change to your target namespace
  labels:
    app: d2k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: d2k
  template:
    metadata:
      labels:
        app: d2k
    spec:
      serviceAccountName: d2k
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Kubernetes would inject D2K_PORT, D2K_SERVICE_HOST, ... for the d2k
      # Service, which collide with d2k's own D2K_* settings.
      enableServiceLinks: false
      volumes:
        # TLS Secret — required. d2k serves the Docker API over mutual TLS and
        # does not start without it. Create the certificates and the Secret
        # before applying this manifest, using every address clients use:
        #   d2k pki init --san d2k.example.com,10.0.0.10 --out d2k-pki
        #   kubectl create secret generic d2k-tls --from-file=d2k-pki/server -n d2k
        # Clients (Docker CLI, Portainer "Docker API" with TLS) use the files in
        # d2k-pki/client. cert-manager can issue the Secret instead: it must
        # hold tls.crt, tls.key and ca.crt, and ca.crt must be the CA that
        # signs client certificates.
        - name: tls
          secret:
            secretName: d2k-tls
      containers:
        - name: d2k
          image: portainer/d2k:latest   # replace with your image
          imagePullPolicy: Always
          ports:
            - name: docker-api
              containerPort: 2376
            - name: health
              containerPort: 8081
          env:
            - name: D2K_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: D2K_SWARM_MODE
              value: "true"   # set to "false" to run in Docker host mode instead
            - name: D2K_LOG_LEVEL
              value: "info"
            # D2K_KUBECONFIG is intentionally not set — in-cluster auth is used.
            # D2K_TLS_CERT_FILE, D2K_TLS_KEY_FILE and D2K_TLS_CA_FILE default to
            # tls.crt, tls.key and ca.crt in /etc/d2k/tls, the d2k-tls mount.
            # D2K_INSECURE=true serves the API without TLS on port 2375 instead.
            # Anyone who can reach it controls the namespace: never expose it.
          volumeMounts:
            - name: tls
              mountPath: /etc/d2k/tls
              readOnly: true
          # The Docker API requires a client certificate, so probes use the
          # plain health port, which serves /healthz only.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # d2k is a static binary that needs no privileges and writes no files
          # (except the unix socket, when D2K_SOCKET points at a mounted volume).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
# OPTION A — LoadBalancer Service
# Use this when your cluster has a cloud load balancer controller or a bare-metal
# equivalent (e.g. MetalLB). The controller assigns an external IP automatically.
# Connect Portainer to: tcp://<EXTERNAL-IP>:2376 with TLS, using the client
# certificate from `d2k pki init`. The address must be one of its --san names.
# Delete this section if you are using the NodePort option below.
apiVersion: v1
kind: Service
metadata:
  name: d2k
  namespace: d2k   # change to your target namespace
  labels:
    app: d2k
spec:
  selector:
    app: d2k
  ports:
    - name: docker-api
      port: 2376
      targetPort: 2376
  type: LoadBalancer

---
# OPTION B — NodePort Service
# Use this when your cluster does not have a load balancer controller (e.g. bare
# metal, on-prem, or single-node clusters). The Docker API is reachable on every
# node at the assigned NodePort (30000-32767 range, assigned by Kubernetes).
# Connect Portainer to: tcp://<ANY-NODE-IP>:<NODE-PORT> with TLS (see Option A).
# You can pin the NodePort to a specific value by uncommenting nodePort below.
# Delete this section if you are using the LoadBalancer option above.
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: d2k
#   namespace: d2k   # change to your target namespace
#   labels:
#     app: d2k
# spec:
#   selector:
#     app: d2k
#   ports:
#     - name: docker-api
#       port: 2376
#       targetPort: 2376
#       # nodePort: 32376   # uncomment to pin to a specific port
#   type: NodePort
